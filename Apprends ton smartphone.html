<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apprends ton smartphone</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f5f4;--card:#fff;--tx:#0f2a33;--mu:#4f6a72;--ac:#0e7c86;--hl:#ffb800;--ok:#15803d;--ko:#c81e4b;--ln:#cfe3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1c21;--card:#12303a;--tx:#eaf6f6;--mu:#9bbcc3;--ac:#35c2cd;--ln:#24505b;--ok:#4ade80;--ko:#fb7185}}
:root[data-theme="dark"]{--bg:#0b1c21;--card:#12303a;--tx:#eaf6f6;--mu:#9bbcc3;--ac:#35c2cd;--ln:#24505b;--ok:#4ade80;--ko:#fb7185}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.5 Nunito,"Trebuchet MS",system-ui,sans-serif;min-height:100%}
h1{font-size:1.7rem;margin:0;font-weight:900}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap}
header p{margin:0;color:var(--mu)}
#prog{font-weight:900;color:var(--ac)}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px}
nav button{flex:none;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
nav button.dn::after{content:" ✓";color:var(--ok)}
nav button.on.dn::after{color:#fff}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;max-width:1000px;margin:0 auto;padding:6px 18px 40px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.phone{margin:0 auto}}
.guide{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:20px 22px}
.guide h2{margin:0 0 6px;font-size:1.35rem}
.guide p{margin:0 0 10px}
#ex{margin-top:12px}
.opt,.nx{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--ln);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.opt:hover,.nx:hover{border-color:var(--ac)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,transparent)}
.nx{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:900;text-align:center}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs2 button{border:0;border-radius:10px;padding:6px 12px;background:var(--ln);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.tabs2 button.on{background:var(--ac);color:#fff}
.th{background:color-mix(in srgb,var(--hl) 18%,transparent);border-left:5px solid var(--hl);border-radius:10px;padding:10px 14px}
.th ul{margin:6px 0 0;padding-left:20px}
/* phone */
.phone{width:290px;height:590px;border:10px solid #101820;border-radius:42px;background:#101820;position:sticky;top:12px;box-shadow:0 18px 40px #0004;overflow:hidden}
#scr{width:100%;height:100%;border-radius:30px;overflow:hidden;position:relative;background:#fff;color:#111;font-family:Nunito,system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column}
#scr.dk{color:#fff}
#scr.wall{background:linear-gradient(160deg,#0e7c86,#1b2a6b 60%,#6a1b9a)}
#scr.cam{background:#000;color:#fff}
.sb{display:flex;justify-content:space-between;padding:8px 20px 2px;font-size:12px;flex:none}
.pg{flex:1;position:relative;overflow:auto;padding:6px 14px 14px;display:flex;flex-direction:column}
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding-top:30px}
.app{text-align:center;font-size:10px;cursor:pointer}
.app i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 3px;border-radius:13px;font-style:normal;font-size:23px}
.app.jig i{animation:jig .3s infinite alternate}
.fold i{background:#ffffff40;grid-template-columns:1fr 1fr;font-size:12px;padding:5px;backdrop-filter:blur(4px)}
@keyframes jig{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes pl{50%{box-shadow:0 0 0 9px #ffb80066}}
.hl{animation:pl 1.2s infinite}
.app.hl{animation:none}.app.hl i{animation:pl 1.2s infinite}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sh{animation:sh .3s}
.ph{margin:6px 0 10px;font-size:20px}
.btn{border:0;border-radius:12px;background:#0e7c86;color:#fff;padding:11px;font:inherit;font-weight:900;cursor:pointer;margin-top:10px;width:100%}
.btn.r{background:#e11d48}.btn.g{background:#16a34a}
label{font-size:12px;color:#666;margin-top:8px}
input,textarea{width:100%;border:2px solid #cbd5e1;border-radius:10px;padding:9px;font:inherit;font-size:15px;color:#111;background:#fff}
.fab{position:absolute;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;border:0;background:#0e7c86;color:#fff;font-size:26px;cursor:pointer}
.em{color:#888;text-align:center;margin-top:60px}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
.av{width:38px;height:38px;border-radius:50%;background:#0e7c86;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.lock{text-align:center;color:#fff;margin:-30px -14px -14px;padding:60px 14px 14px;flex:1;background:linear-gradient(170deg,#1b2a6b,#0e7c86)}
.clk{font-size:62px;font-weight:900;line-height:1}
.notif{background:#ffffff30;border-radius:14px;padding:10px;margin:30px 0;font-size:13px}
.swipe{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:900;white-space:nowrap;cursor:pointer}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dots b{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots b.f{background:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{border:0;border-radius:50%;height:46px;font:inherit;font-size:20px;font-weight:700;background:#ffffff30;color:inherit;cursor:pointer}
#scr:not(.dk) .k{background:#eef2f6}
.dsp{text-align:center;font-size:24px;min-height:40px;font-weight:700;margin:10px 0}
.call{width:60px;height:60px;border-radius:50%;border:0;background:#16a34a;font-size:24px;cursor:pointer;margin:0 auto}
.cr{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;margin-top:8px}.cr .call{grid-column:2}
.tb{display:flex;margin:auto -14px -14px;border-top:1px solid #ddd}
.tb b{flex:1;text-align:center;padding:10px;font-size:12px;cursor:pointer}.tb b.on{color:#0e7c86}
.pulse{width:90px;height:90px;border-radius:50%;margin:30px auto 10px;font-size:36px;display:grid;place-items:center;background:#0e7c86;animation:pl2 1.5s infinite}
@keyframes pl2{50%{box-shadow:0 0 0 18px #0e7c8644}}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;margin:4px 0;animation:pop .25s}
.bub.o{background:#0e7c86;color:#fff;align-self:flex-end}.bub.i{background:#e5e7eb;align-self:flex-start}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ty span{display:inline-block;animation:bn 1s infinite}.ty span:nth-child(2){animation-delay:.15s}.ty span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px)}}
.bar{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:#16a34a;transition:width .2s}
.res{border:2px solid #e5e7eb;border-radius:14px;padding:10px;margin:8px 0}
.res small{color:#666;display:block}
.splash{margin:-6px -14px -14px;flex:1;background:#ff4612;color:#fff;display:grid;place-items:center;text-align:center}
.splash b{font-size:42px;animation:zm 1.2s ease-out}
@keyframes zm{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.ovl{position:absolute;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:5}
.dlg{background:#fff;color:#111;border-radius:18px;padding:16px;text-align:center}
.dlg button{display:block;width:100%;border:0;background:#eef2f6;border-radius:10px;padding:10px;margin-top:6px;font:inherit;font-weight:700;cursor:pointer}
.vf{position:relative;width:200px;height:200px;margin:50px auto 0;border:3px solid #fff;border-radius:18px;overflow:hidden;background:#222;display:grid;place-items:center}
.vf::after{content:"";position:absolute;left:0;right:0;height:3px;background:#4ade80;box-shadow:0 0 12px #4ade80;animation:sc 2s infinite alternate}
@keyframes sc{from{top:0}to{top:100%}}
.qr{display:grid;grid-template-columns:repeat(9,1fr);width:110px;height:110px;background:#fff;padding:5px;cursor:pointer}.qr i{background:#fff}.qr i.b{background:#000}
.chk{width:90px;height:90px;margin:30px auto 0}.chk path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .7s .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:99;animation:fl 2.4s linear forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(105vh) rotate(720deg)}}
.sms{background:#e5e7eb;border-radius:14px;padding:12px;margin:10px 0;font-size:13px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.gr div{aspect-ratio:1;background:#dbeafe;display:grid;place-items:center;font-size:30px;border-radius:6px;cursor:pointer}
.sw{width:44px;height:26px;border-radius:99px;background:#cbd5e1;position:relative;cursor:pointer;flex:none;margin-left:auto}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#16a34a}.sw.on::after{left:21px}
.big .pg{font-size:19px}.pst{border:2px solid #e5e7eb;border-radius:12px;padding:10px;margin:6px 0}.pst button{border:0;background:#eef2f6;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;margin:6px 4px 0 0;cursor:pointer}
.fin{position:fixed;inset:0;z-index:50;background:#0b1c21ee;display:grid;place-items:center;overflow:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.dip{background:var(--card);color:var(--tx);border:4px solid var(--hl);border-radius:24px;max-width:460px;width:100%;padding:24px;text-align:center;position:relative;z-index:2;animation:zm2 .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes zm2{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.tro{font-size:80px;line-height:1.2;animation:bo 1.4s infinite}
@keyframes bo{50%{transform:translateY(-14px) rotate(8deg) scale(1.1)}}
.dip h2{margin:0 0 12px}.dip h2 span{background:linear-gradient(90deg,#e11d48,#f59e0b,#16a34a,#0ea5e9,#7c4dff,#e11d48);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 3s linear infinite;font-size:1.9rem}
@keyframes rb{to{background-position:200%}}
.dip input{width:100%;border:2px solid var(--ln);border-radius:12px;padding:10px;font:inherit;text-align:center;background:var(--bg);color:var(--tx)}
.fe{position:fixed;bottom:-50px;font-size:30px;z-index:1;animation:ri 6s linear infinite;pointer-events:none}
@keyframes ri{to{transform:translateY(-115vh) rotate(40deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><h1>📱 Apprends ton smartphone</h1><p>12 modules interactifs, à ton rythme</p></div><div id="prog"></div></header>
<nav id="nav"></nav>
<div class="wrap">
<section class="guide"><h2 id="gt"></h2><div id="gx"></div><div id="ex"></div></section>
<div class="phone"><div id="scr"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),scr=$('#scr');
let cur=-1,done=new Set(),contacts=[],log=[],timer=null;
const APPS=[['tel','📞','Téléphone','#16a34a'],['ct','👤','Contacts','#f59e0b'],['sms','💬','Messages','#0ea5e9'],['st','▶️','Play Store','#7c4dff'],['ph','🖼️','Photos','#e11d48'],['cam','📷','Appareil','#475569'],['set','⚙️','Réglages','#78808c'],['clk','⏰','Horloge','#1f2937'],['wa','🟢','WhatsApp','#25d366'],['fb','📘','Facebook','#1877f2']];
const S=(h,c='')=>{clearInterval(timer);scr.className=c;scr.innerHTML='<div class=sb><b>09:41</b><span>📶 🔋</span></div><div class=pg>'+h+'</div>';scr.onclick=null;scr.oninput=null};
const on=m=>scr.onclick=e=>{for(const k in m){const t=e.target.closest(k);if(t){m[k](t,e);return}}};
const say=(t,x)=>{$('#gt').textContent=t;$('#gx').innerHTML=x;$('#ex').innerHTML=''};
const shake=s=>{const e=$(s);e.classList.remove('sh');void e.offsetWidth;e.classList.add('sh')};
const home=(hl)=>'<div class=home>'+APPS.map(a=>`<div class="app ${hl==a[0]?'hl':''}" data-a=${a[0]}><i style="background:${a[3]}">${a[1]}</i>${a[2]}</div>`).join('')+'</div>';
const nums=v=>v.replace(/\D/g,'');
const ck=(L,d)=>$('#ex').innerHTML='<div class=th>'+L.map((l,i)=>(d.has(i)?'✅ ':'⬜ ')+l).join('<br>')+'</div>';
function cf(){for(let i=0;i<45;i++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},85%,60%);animation-delay:${Math.random()*.6}s`;document.body.append(s);setTimeout(()=>s.remove(),3200)}}
function finish(msg){done.add(cur);cf();nav();if(done.size==M.length)setTimeout(fin,2600);say('🎉 Bravo, module terminé !',msg);$('#ex').innerHTML=`${cur<M.length-1?'<button class=nx onclick="go('+(cur+1)+')">Module suivant ➜</button>':''}<button class=opt onclick="go(${cur})">🔁 Recommencer ce module</button>`}
function quiz(q,opts,cb){$('#ex').innerHTML=`<p><b>${q}</b></p>`+opts.map((o,i)=>`<button class=opt data-i=${i}>${o[0]}</button>`).join('')+'<div id=fb></div>';
$('#ex').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.dataset.i==null)return;const o=opts[b.dataset.i];b.classList.add(o[1]?'good':'bad');$('#fb').innerHTML=`<div class=th>${o[1]?'✅ ':'❌ '}${o[2]}</div>`;if(o[1]){$('#ex').onclick=null;setTimeout(cb,1800)}}}
const M=[
['🔓 Déverrouiller',()=>{
 S(`<div class=lock><div class=clk>09:41</div><div>vendredi 16 octobre</div><div class=notif>💬 <b>Maman</b> : Tu rentres à quelle heure ?</div><div class="swipe hl" id=sw>⬆ Glisse vers le haut</div></div>`,'dk');
 say('Ton téléphone est verrouillé','L’écran est « endormi ». Pour le réveiller, on <b>glisse vers le haut</b> avec le doigt (ici : clique sur le bouton qui clignote).');
 on({'#sw':pin})
 function pin(){let v='';const draw=()=>$('#d').innerHTML=[0,1,2,3].map(i=>`<b class="${i<v.length?'f':''}"></b>`).join('');
  S(`<div class=lock style="padding-top:30px"><p>Entre ton code</p><div class=dots id=d></div><div class=kp>${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class=k>${k}</button>`).join('')}</div></div>`,'dk');draw();
  say('Le code PIN','Tape <b>1 2 3 4</b> (exemple pour s’entraîner : ton vrai code doit rester <u>secret</u> et ne jamais être 1234 !).');
  on({'.k':t=>{if(t.textContent=='⌫')v=v.slice(0,-1);else if(v.length<4)v+=t.textContent;draw();if(v.length==4){if(v=='1234')ok();else{shake('#d');v='';setTimeout(draw,300);say('Code incorrect','Essaie encore : 1 2 3 4. Dans la vraie vie, après plusieurs erreurs le téléphone se bloque pour te protéger.')}}}})}
 function ok(){S(home(),'dk wall');scr.onclick=null;say('✅ Déverrouillé !','Voilà ton écran d’accueil avec toutes tes applications. <div class=th><b>Pourquoi verrouiller ?</b><ul><li>Si on te vole ou perd ton téléphone, personne ne lit tes SMS (même ceux avec les codes de ta banque).</li><li>Tes photos, mails et applis (itsme, banque) restent protégés.</li><li>Il évite les appels ou achats « par accident » dans ta poche.</li></ul></div>');
  quiz('Petit jeu : pourquoi vaut-il mieux garder son code secret ?',[['Pour économiser la batterie',0,'Non, ça n’a aucun rapport avec la batterie.'],['Pour que personne ne puisse utiliser mon téléphone et mes applis en cas de vol ou de perte',1,'Exactement ! Et on ne donne jamais son code, même à quelqu’un qui dit « être de la banque ».'],['Parce que la loi l’oblige',0,'Non, c’est un choix qui te protège toi.']],()=>finish('Tu sais déverrouiller ton téléphone et tu sais pourquoi le verrouiller. Astuce : active aussi l’empreinte ou le visage dans Réglages.'))}
}],
['👤 Créer un contact',()=>{
 S(home('ct'),'dk wall');say('Enregistrer un contact','Un contact = un nom + un numéro. Ensuite, plus besoin de retenir le numéro ! Ouvre l’appli <b>Contacts</b> (elle clignote).');
 on({'[data-a=ct]':list});
 function list(){S(`<h3 class=ph>Contacts</h3>${contacts.map(c=>`<div class=row><div class=av>${c.n[0].toUpperCase()}</div>${c.n}</div>`).join('')||'<p class=em>Aucun contact pour l’instant</p>'}<button class="fab hl" id=ad>＋</button>`);say('La liste est vide','Appuie sur le bouton <b>＋</b> en bas à droite pour ajouter quelqu’un.');on({'#ad':form})}
 function form(){S(`<h3 class=ph>Nouveau contact</h3><label>Nom</label><input id=n placeholder="Ex : Maman"><label>Téléphone</label><input id=p type=tel placeholder="0470 12 34 56"><button class="btn hl" id=sv>Enregistrer</button>`);say('Remplis le formulaire','Écris un <b>nom</b> et un <b>numéro</b> (au moins 6 chiffres), puis appuie sur Enregistrer. En Belgique, un GSM commence par 04.');
  on({'#sv':()=>{const n=$('#n').value.trim(),p=$('#p').value.trim();if(!n||nums(p).length<6){shake('#sv');return}contacts.push({n,p});
   S(`<div style="text-align:center;margin-top:30px"><div class=av style="width:80px;height:80px;font-size:34px;margin:auto;animation:pop .4s">${n[0].toUpperCase()}</div><h3>${n}</h3><p>${p}</p></div><div class=kp style="margin-top:20px"><button class=k>📞</button><button class=k>💬</button><button class=k>✉️</button></div>`);
   finish(`<b>${n}</b> est enregistré(e). Tu peux l’appeler ou lui écrire en un clic.`)}})}
}],
['📞 Téléphoner',()=>{
 S(home('tel'),'dk wall');say('Passer un appel','Ouvre l’appli <b>Téléphone</b> (l’icône verte).');on({'[data-a=tel]':()=>dial()});
 function dial(hl){let v='';const c=contacts[0];S(`<div class=dsp id=ds>&nbsp;</div><div class=kp>${'123456789*0#'.split('').map(k=>`<button class=k>${k}</button>`).join('')}</div><div class=cr><button class="call ${hl?'':'hl'}" id=cl>📞</button><button class=k id=bk style="height:40px">⌫</button></div><div class=tb><b class=on>⌨️ Clavier</b><b id=rc class="${hl?'hl':''}">🕘 Récents</b></div>`);
  say(hl?'Appel terminé':'Compose un numéro',hl?'Pour retrouver tous tes appels (reçus, passés, manqués), ouvre l’onglet <b>Récents</b> en bas.':`Tape un numéro d’au moins 4 chiffres${c?` (par exemple celui de ${c.n} : ${c.p})`:''}, puis appuie sur le bouton vert.`);
  on({'.k':t=>{if(t.id=='bk')v=v.slice(0,-1);else if(v.length<14)v+=t.textContent;$('#ds').textContent=v||'\u00a0'},'#cl':()=>{if(nums(v).length<4){shake('#ds');return}call(v)},'#rc':()=>{if(hl)recents()}})}
 function call(v){const f=contacts.find(c=>nums(c.p)==nums(v)),nm=f?f.n:v;let t=0;S(`<div class=pulse>${f?f.n[0].toUpperCase():'👤'}</div><h3 style="text-align:center;margin:0">${nm}</h3><p style="text-align:center" id=tm>Appel en cours…</p><button class="btn r hl" id=hg style="margin-top:auto">📵 Raccrocher</button>`);
  say('Ça sonne…','Ton correspondant décroche. Quand la conversation est finie, appuie sur le bouton <b>rouge</b> pour raccrocher.');
  timer=setInterval(()=>{t++;$('#tm').textContent='00:'+String(t).padStart(2,'0')},1000);on({'#hg':()=>{log.unshift({n:nm,d:t});dial(true)}})}
 function recents(){S(`<h3 class=ph>Récents</h3>${log.map(l=>`<div class=row><div class=av>${l.n[0].toUpperCase()}</div><div style="flex:1"><b>${l.n}</b><br><small>↗ Appel sortant · ${l.d}s</small></div><small>09:41</small></div>`).join('')}`);
  finish('Voilà l’<b>historique</b> : tu peux y rappeler quelqu’un en un clic, ou y repérer les appels manqués (en rouge). Attention aux numéros inconnus qui rappellent : ne rappelle pas un numéro étranger bizarre !')}
}],
['💬 Envoyer un SMS',()=>{
